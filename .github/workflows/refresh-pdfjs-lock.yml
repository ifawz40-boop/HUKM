name: Refresh PDF.js Bun lockfile

on:
  push:
    branches:
      - 'feat/pdf-reader-pdfjs'
    paths:
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: hukm-pdfjs-lock-refresh
  cancel-in-progress: false

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate lockfile without installing node_modules
        run: bun install --lockfile-only

      - name: Commit updated lockfile to this feature branch
        run: |
          if git diff --quiet -- bun.lock; then
            echo "Bun lockfile already matches package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): refresh Bun lockfile for PDF.js"
          git push origin "HEAD:${GITHUB_REF_NAME}"
