name: Verify Wikimedia PDF CORS

on:
  push:
    branches:
      - 'feat/pdf-reader-pdfjs'
    paths:
      - '.github/workflows/verify-pdf-cors.yml'

permissions:
  contents: read

jobs:
  cors:
    runs-on: ubuntu-latest
    steps:
      - name: Check CORS and byte-range response for the pinned PDF
        run: |
          curl -sS -D - -o /dev/null --max-time 30 \
            -H "Origin: https://hukm-vdqc.vercel.app" \
            -H "Range: bytes=0-1023" \
            "https://upload.wikimedia.org/wikipedia/commons/7/7c/%D9%83%D8%AA%D8%A7%D8%A8_%D9%84%D8%B3%D8%A7%D9%86_%D8%BA%D8%B5%D9%86_%D9%84%D8%A8%D9%86%D8%A7%D9%86_%D9%81%D9%8A_%D8%A7%D9%86%D8%AA%D9%82%D8%A7%D8%AF_%D8%A7%D9%84%D8%B9%D8%B1%D8%A8%D9%8A%D8%A9_%D8%A7%D9%84%D8%B9%D8%B5%D8%B1%D9%8A%D8%A9.pdf" | grep -iE '^(HTTP/|access-control-allow-origin:|access-control-expose-headers:|accept-ranges:|content-range:|content-length:|content-type:)'
