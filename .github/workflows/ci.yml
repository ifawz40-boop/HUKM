name: HUKM verification

on:
  push:
    branches:
      - main
      - 'deploy/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hukm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run test suite
        run: bun run test

      - name: Firestore review security rules emulator tests
        run: npx --yes firebase-tools@15.34.2 emulators:exec --only firestore --project demo-hukm-library-review-rules "bun run test:firestore-rules"

      - name: TypeScript check
        run: bun run lint

      - name: Build production bundle
        run: bun run build
