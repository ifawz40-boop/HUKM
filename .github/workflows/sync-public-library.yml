name: Sync rights-cleared full Arabic books

on:
  push:
    branches:
      - main
      - 'deploy/**'
    paths:
      - 'src/data/library/manifest.json'
      - 'scripts/sync-public-library.mjs'
      - '.github/workflows/sync-public-library.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hukm-library-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-library:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Hugging Face Datasets reader
        run: python -m pip install "datasets==5.1.0"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download, validate and bundle selected works
        run: node scripts/sync-public-library.mjs

      - name: Commit bundled full texts to the triggering branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/library/books src/data/library/catalog.json src/data/library/NOTICE.md
          if git diff --cached --quiet; then
            echo "No generated library changes."
            exit 0
          fi
          git commit -m "data: bundle rights-screened Arabic books"
          # The sync may take several minutes while other preparation commits land.
          # Rebase the generated data commit onto the latest branch head; never force-push.
          git fetch origin "${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
