name: Probe public book source access

on:
  push:
    branches: [main]
    paths:
      - "scripts/probe-public-library-source.mjs"
      - "scripts/extract-library-chapters.py"
      - "scripts/fixtures/selected-books-streaming-probe.json"
      - ".github/workflows/probe-public-library-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hukm-public-library-source-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe Hugging Face dataset endpoints
        run: node scripts/probe-public-library-source.mjs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Hugging Face Datasets reader
        run: python -m pip install "datasets==5.1.0"
      - name: Probe pinned Parquet streaming
        run: python scripts/probe-hf-datasets-streaming.py
      - name: Verify complete selected-book chapter extraction
        run: python scripts/extract-library-chapters.py scripts/fixtures/selected-books-streaming-probe.json /tmp/hukm-selected-chapters-probe.jsonl
