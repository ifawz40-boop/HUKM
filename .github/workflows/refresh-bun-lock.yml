name: Temporary Bun lock refresh

on:
  push:
    branches:
      - feat/firestore-review-rules-emulator

permissions:
  contents: write

jobs:
  refresh-lock:
    if: "!startsWith(github.event.head_commit.message, 'chore(lockfile):')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate lockfile
        run: bun install

      - name: Commit updated lockfile
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore(lockfile): add Firestore rules test dependency"
            git push
          fi
