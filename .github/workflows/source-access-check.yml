name: Verify SND corpus source access

on:
  push:
    branches:
      - debug/snd-source-access
    paths:
      - .github/workflows/source-access-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check metadata.tsv download from the official corpus record
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://api.researchdata.se/dataset/2024-145/1/file/documentation?filePath=metadata.tsv'
            'https://doris.snd.se//api/file/2024-145-1/1/documentation?filePath=metadata.tsv'
          )
          downloaded=false
          for url in "${urls[@]}"; do
            echo "--- trying ${url} ---"
            if curl --fail --location --show-error --silent \
              --user-agent 'Mozilla/5.0 (compatible; HUKM-MEDIA-library-sync/1.0)' \
              --header 'Referer: https://researchdata.se/en/catalogue/dataset/2024-145/1' \
              --header 'Origin: https://researchdata.se' \
              --header 'Accept: application/octet-stream,*/*' \
              --connect-timeout 20 --max-time 120 \
              --dump-header /tmp/snd-headers.txt \
              --output /tmp/hukm-metadata.tsv \
              --write-out 'HTTP=%{http_code}\nFINAL_URL=%{url_effective}\nBYTES=%{size_download}\nCONTENT_TYPE=%{content_type}\n' \
              "$url"; then
              downloaded=true
              break
            fi
          done
          test "$downloaded" = true
          echo '--- response headers ---'
          tail -n 20 /tmp/snd-headers.txt
          echo '--- metadata preview ---'
          head -n 3 /tmp/hukm-metadata.tsv
          test -s /tmp/hukm-metadata.tsv

      - name: Verify the public Hugging Face Arrow mirror and pinned SHA-256
        shell: bash
        run: |
          set -euo pipefail
          url='https://huggingface.co/datasets/mohres/The_Arabic_E-Book_Corpus/resolve/2d5c131050b7572a345ebf740caee24739f7a09e/data-00000-of-00002.arrow'
          curl --fail --location --show-error --silent \
            --retry 3 --retry-all-errors --connect-timeout 30 --max-time 900 \
            --output /tmp/hukm-arrow-00000.arrow \
            --write-out 'HTTP=%{http_code}\nFINAL_URL=%{url_effective}\nBYTES=%{size_download}\n' \
            "$url"
          actual="$(sha256sum /tmp/hukm-arrow-00000.arrow | awk '{print $1}')"
          expected='1d1acb60a0bad8cbf1580656615f5388703d263c917f8f52892155f8cc15981d'
          echo "SHA256=$actual"
          test "$actual" = "$expected"
          stat -c 'FILE_BYTES=%s' /tmp/hukm-arrow-00000.arrow

      - name: Inspect the pinned Arrow corpus schema and candidate book metadata
        shell: bash
        run: |
          set -euo pipefail
          url='https://huggingface.co/datasets/mohres/The_Arabic_E-Book_Corpus/resolve/2d5c131050b7572a345ebf740caee24739f7a09e/data-00001-of-00002.arrow'
          curl --fail --location --show-error --silent \
            --retry 3 --retry-all-errors --connect-timeout 30 --max-time 900 \
            --output /tmp/hukm-arrow-00001.arrow \
            --write-out 'HTTP=%{http_code}\nBYTES=%{size_download}\n' \
            "$url"
          actual="$(sha256sum /tmp/hukm-arrow-00001.arrow | awk '{print $1}')"
          expected='48643253c0cffe6d2a2815922eeac7f63677100efccb074ab52ad5c06055727f'
          echo "SHA256=$actual"
          test "$actual" = "$expected"
          python -m pip install --quiet pyarrow
          file /tmp/hukm-arrow-00000.arrow /tmp/hukm-arrow-00001.arrow
          python - <<'PY'
          import pyarrow as pa
          import pyarrow.ipc as ipc
          import pyarrow.parquet as pq
          from collections import Counter

          paths = ('/tmp/hukm-arrow-00000.arrow', '/tmp/hukm-arrow-00001.arrow')
          rows = []
          for name in paths:
              with open(name, 'rb') as stream:
                  first = stream.read(16)
                  stream.seek(-16, 2)
                  last = stream.read(16)
              print('MAGIC', name, first.hex(), last.hex())
              table = None
              for label, opener in (
                  ('ipc-file', lambda: ipc.open_file(name).read_all()),
                  ('ipc-stream', lambda: ipc.open_stream(name).read_all()),
                  ('parquet', lambda: pq.read_table(name)),
              ):
                  try:
                      table = opener()
                      print('FORMAT', name, label)
                      break
                  except Exception as error:
                      print('FORMAT_ERROR', name, label, type(error).__name__, str(error)[:180])
              if table is None:
                  raise RuntimeError(f'No supported Arrow/Parquet reader for {name}')
              print('SCHEMA', table.schema)
              print('ROWS', name, table.num_rows)
              rows.extend(table.to_pylist())

          print('TOTAL_ROWS', len(rows))
          print('COLUMNS', list(rows[0].keys()) if rows else [])
          print('CATEGORY_COUNTS', Counter(
              category.strip()
              for row in rows
              for category in str(row.get('category') or '').split(',')
              if category.strip()
          ).most_common(25))
          for row in rows:
              if row.get('booknr') in (13035305, 13050381):
                  text = row.get('text') or ''
                  print('TEXT_PREVIEW', row.get('booknr'), repr(text[:2200]))
                  print('TEXT_PARAGRAPHS', row.get('booknr'), len([p for p in text.split('\\n\\n') if p.strip()]))
                  print('TEXT_LINES', row.get('booknr'), len([line for line in text.splitlines() if line.strip()]))
          print('SAMPLE', [
              {
                  key: row.get(key)
                  for key in ('booknr', 'category', 'title', 'author', 'wc', 'origpubdate', 'translation', 'category.main')
              } | {'text_chars': len(row.get('text') or '')}
              for row in rows[:3]
          ])
          targets = [
              'history', 'literature', 'novels', 'detective.fiction',
              'biographies', 'philosophy', 'science', 'poetry',
              'children.stories', 'politics', 'plays', 'travel.literature',
              'psychology', 'social.sciences', 'arts', 'linguistics'
          ]
          for category in targets:
              candidates = [
                  row for row in rows
                  if row.get('category.main') == category
                  and 8000 <= int(row.get('wc') or 0) <= 120000
                  and row.get('text')
              ]
              candidates.sort(key=lambda row: (
                  bool(row.get('translation')),
                  abs(int(row.get('wc') or 0) - 30000),
                  int(row.get('booknr') or 0)
              ))
              print('CANDIDATES', category, [
                  {
                      'booknr': row.get('booknr'),
                      'title': row.get('title'),
                      'author': row.get('author'),
                      'wc': row.get('wc'),
                      'origpubdate': row.get('origpubdate.full') or row.get('origpubdate'),
                      'translation': row.get('translation'),
                  }
                  for row in candidates[:5]
              ])
          assert len(rows) == 1745, f'Expected 1745 source books, got {len(rows)}'
          assert all(row.get('text') for row in rows), 'At least one source book has no full text'
          PY
