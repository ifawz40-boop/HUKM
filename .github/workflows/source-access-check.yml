name: Verify SND corpus source access

on:
  push:
    branches:
      - debug/snd-source-access
    paths:
      - .github/workflows/source-access-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check metadata.tsv download from the official corpus record
        shell: bash
        run: |
          set -euo pipefail
          url='https://api.researchdata.se/dataset/2024-145/1/file/documentation?filePath=metadata.tsv'
          curl --fail --location --show-error --silent \
            --retry 2 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --dump-header /tmp/snd-headers.txt \
            --output /tmp/hukm-metadata.tsv \
            --write-out 'HTTP=%{http_code}\nFINAL_URL=%{url_effective}\nBYTES=%{size_download}\nCONTENT_TYPE=%{content_type}\n' \
            "$url"
          echo '--- response headers ---'
          tail -n 20 /tmp/snd-headers.txt
          echo '--- metadata preview ---'
          head -n 3 /tmp/hukm-metadata.tsv
          test -s /tmp/hukm-metadata.tsv
